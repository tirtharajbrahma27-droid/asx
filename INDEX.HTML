<style>
  :root{
    --bg-0:#05070a;
    --bg-1:#0a0f16;
    --card:#0d131b;
    --line:#1a2430;
    --blue:#2fb6ff;
    --green:#a6e22c;
    --steel:#8a97a6;
    --white:#eef3f8;
    --danger:#ff4d5e;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100dvh;
    background:
      radial-gradient(700px 500px at 15% -10%, rgba(47,182,255,0.16), transparent 60%),
      radial-gradient(700px 500px at 85% 110%, rgba(166,226,44,0.14), transparent 60%),
      var(--bg-0);
    color:var(--white);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: calc(24px + var(--safe-t)) 20px calc(24px + var(--safe-b));
    overflow-x:hidden;
  }

  /* ambient grid + pulse line background */
  .bg-grid{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(47,182,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(47,182,255,0.05) 1px, transparent 1px);
    background-size: 34px 34px;
    mask-image: radial-gradient(circle at 50% 30%, black, transparent 75%);
  }
  .pulse-track{
    position:fixed; left:0; right:0; top:8%; height:60px; z-index:0; opacity:0.35; pointer-events:none;
  }
  .pulse-track svg{width:200%; height:100%;}
  .pulse-line{
    fill:none; stroke:var(--blue); stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
    animation: pulse-run 6s linear infinite;
  }
  @keyframes pulse-run{ from{transform:translateX(0);} to{transform:translateX(-50%);} }

  .wrap{ position:relative; z-index:1; width:100%; max-width:400px; }

  .brand{ display:flex; flex-direction:column; align-items:center; margin-bottom:22px; }
  .logo-ring{
    position:relative; width:104px; height:104px; margin-bottom:10px;
    animation: float 4.5s ease-in-out infinite;
  }
  @keyframes float{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  .logo-ring img{ width:100%; height:100%; object-fit:contain; filter: drop-shadow(0 0 18px rgba(47,182,255,0.35)) drop-shadow(0 0 12px rgba(166,226,44,0.25)); }
  .logo-ring::after{
    content:''; position:absolute; inset:-10px; border-radius:50%;
    border:1px solid rgba(47,182,255,0.25);
    animation: ring-pulse 2.4s ease-out infinite;
  }
  @keyframes ring-pulse{
    0%{ transform:scale(0.9); opacity:0.9; }
    80%{ transform:scale(1.25); opacity:0; }
    100%{ opacity:0; }
  }
  .brand h1{
    font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:2px;
    font-size:26px; margin:2px 0 0; text-transform:uppercase;
  }
  .brand h1 span{ color:var(--green); }
  .brand p{ margin:4px 0 0; font-size:12px; letter-spacing:1.5px; color:var(--steel); text-transform:uppercase; }

  .card{
    background:linear-gradient(180deg, var(--card), #0a0e14);
    border:1px solid var(--line);
    border-radius:18px;
    padding:26px 22px 22px;
    position:relative;
    overflow:hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .card::before{
    content:''; position:absolute; top:0; left:-100%; width:100%; height:2px;
    background:linear-gradient(90deg, transparent, var(--blue), var(--green), transparent);
    animation: sweep 3.2s linear infinite;
  }
  @keyframes sweep{ to{ left:100%; } }

  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-size:11px; letter-spacing:1.4px; text-transform:uppercase;
    color:var(--steel); margin-bottom:7px; font-weight:600;
  }
  .field .input-row{
    display:flex; align-items:center; gap:10px;
    background:#080b10; border:1px solid var(--line); border-radius:10px;
    padding:0 14px; transition:border-color .2s, box-shadow .2s;
  }
  .field .input-row:focus-within{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(47,182,255,0.12);
  }
  .field input{
    flex:1; min-width:0; background:transparent; border:0; outline:0;
    color:var(--white); font-size:16px; padding:13px 0; font-family:'Inter',sans-serif;
  }
  .field input::placeholder{ color:#4a5563; }
  .icon{ width:18px; height:18px; flex:0 0 auto; color:var(--steel); }
  .eye-btn{ background:none; border:0; color:var(--steel); cursor:pointer; padding:6px; display:flex; }
  .eye-btn:active{ color:var(--blue); }

  .error-msg{
    display:none; align-items:center; gap:8px; color:var(--danger); font-size:13px;
    background:rgba(255,77,94,0.08); border:1px solid rgba(255,77,94,0.25);
    border-radius:8px; padding:9px 12px; margin-bottom:14px;
  }
  .error-msg.show{ display:flex; }
  .card.shake{ animation: shake .4s; }
  @keyframes shake{
    20%,60%{ transform:translateX(-6px); } 40%,80%{ transform:translateX(6px); }
  }

  .signin-btn{
    width:100%; border:0; border-radius:10px; padding:14px;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:16px; letter-spacing:1.5px;
    text-transform:uppercase; color:#04140a; cursor:pointer;
    background:linear-gradient(90deg, var(--blue), var(--green));
    position:relative; overflow:hidden;
    transition:transform .15s ease, filter .15s ease;
  }
  .signin-btn:active{ transform:scale(0.98); filter:brightness(0.95); }
  .signin-btn:disabled{ opacity:0.6; pointer-events:none; }
  .signin-btn .spinner{
    display:none; width:16px; height:16px; border:2px solid rgba(4,20,10,0.35);
    border-top-color:#04140a; border-radius:50%; animation:spin .6s linear infinite;
    position:absolute; left:50%; top:50%; margin:-8px 0 0 -8px;
  }
  .signin-btn.loading .btn-label{ visibility:hidden; }
  .signin-btn.loading .spinner{ display:block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .status{
    display:flex; align-items:center; justify-content:center; gap:7px;
    margin-top:18px; font-size:11.5px; color:var(--steel); letter-spacing:0.4px;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--steel); flex:0 0 auto; }
  .dot.online{ background:var(--green); box-shadow:0 0 8px var(--green); animation:blip 1.6s ease-in-out infinite; }
  .dot.offline{ background:var(--danger); box-shadow:0 0 8px var(--danger); }
  @keyframes blip{ 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  .foot-note{ text-align:center; margin-top:14px; font-size:11px; color:#3d4552; letter-spacing:0.5px; }

  @media (max-width:360px){
    .brand h1{ font-size:22px; }
    .card{ padding:22px 18px 18px; }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>

      L660,30 L680,30 L695,8 L710,52 L725,30 L760,30 L780,30 L795,15 L810,45 L825,30 L1200,30"/>
  </svg>
</div>

<div class="wrap">

    <h1>FIT<span>TRACK</span></h1>
    <p>Train. Track. Transform.</p>
  </div>

  <form class="card" id="loginCard" novalidate>
    <div class="error-msg" id="errorMsg">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="errorText">Invalid ID or password.</span>
    </div>

    <div class="field">
      <label for="userId">User ID</label>
      <div class="input-row">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="userId" placeholder="Enter your ID" autocomplete="username" inputmode="text" required>
      </div>
    </div>

    <div class="field">
      <label for="userPass">Password</label>
      <div class="input-row">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="userPass" placeholder="Enter your password" autocomplete="current-password" required>
        <button type="button" class="eye-btn" id="toggleEye" aria-label="Show password">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <button type="submit" class="signin-btn" id="signinBtn">
      <span class="btn-label">Sign In</span>
      <span class="spinner"></span>
    </button>

    <div class="status">
      <span class="dot" id="dbDot"></span>
      <span id="dbStatus">Connecting to database…</span>
    </div>
  </form>

  <p class="foot-note">FitTrack &copy; TRB Creative</p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getDatabase, ref, get, set, onValue
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDT5K4TnXQCc50y-vwmXnX-RBS6t0K_eu8",
    authDomain: "fit-track-c8e50.firebaseapp.com",
    databaseURL: "https://fit-track-c8e50-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "fit-track-c8e50",
    storageBucket: "fit-track-c8e50.firebasestorage.app",
    messagingSenderId: "754591685256",
    appId: "1:754591685256:web:7b14a9a3688ffddf249d3d",
    measurementId: "G-MBW9YBENN9"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ---- Realtime DB connection indicator ----
  const dbDot = document.getElementById('dbDot');
  const dbStatus = document.getElementById('dbStatus');
  onValue(ref(db, '.info/connected'), (snap) => {
    if (snap.val() === true) {
      dbDot.className = 'dot online';
      dbStatus.textContent = 'Database active';
    } else {
      dbDot.className = 'dot offline';
      dbStatus.textContent = 'Database offline';
    }
  });

  // ---- Admin credentials (hardcoded — see note below) ----
  const ADMIN_ID = "9733145787";
  const ADMIN_PASS = "Tirtha@2002";

  // ---- Elements ----
  const form = document.getElementById('loginCard');
  const userIdInput = document.getElementById('userId');
  const userPassInput = document.getElementById('userPass');
  const errorMsg = document.getElementById('errorMsg');
  const errorText = document.getElementById('errorText');
  const signinBtn = document.getElementById('signinBtn');
  const toggleEye = document.getElementById('toggleEye');

  toggleEye.addEventListener('click', () => {
    const isPass = userPassInput.type === 'password';
    userPassInput.type = isPass ? 'text' : 'password';
  });

  function showError(msg){
    errorText.textContent = msg;
    errorMsg.classList.add('show');
    form.classList.remove('shake');
    void form.offsetWidth; // restart animation
    form.classList.add('shake');
  }
  function hideError(){
    errorMsg.classList.remove('show');
  }
  function setLoading(state){
    signinBtn.classList.toggle('loading', state);
    signinBtn.disabled = state;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    const id = userIdInput.value.trim();
    const pass = userPassInput.value;

    if (!id || !pass){
      showError('Enter both ID and password.');
      return;
    }

    setLoading(true);

    try {
      // 1. Admin check — credentials live in RTDB at admin/profile.
      //    If that node doesn't exist yet (first run ever), bootstrap it
      //    from the original hardcoded values, then use DB from then on.
      const adminSnap = await get(ref(db, 'admin/profile'));
      if (adminSnap.exists()) {
        const admin = adminSnap.val();
        if (id === admin.phone && pass === admin.password) {
          sessionStorage.setItem('ft_role', 'admin');
          sessionStorage.setItem('ft_id', id);
          setTimeout(() => { window.location.href = 'admin.html'; }, 350);
          return;
        }
      } else if (id === ADMIN_ID && pass === ADMIN_PASS) {
        await set(ref(db, 'admin/profile'), {
          name: 'Tirtha',
          phone: ADMIN_ID,
          password: ADMIN_PASS
        });
        sessionStorage.setItem('ft_role', 'admin');
        sessionStorage.setItem('ft_id', id);
        setTimeout(() => { window.location.href = 'admin.html'; }, 350);
        return;
      }

      // 2. Member check against Realtime Database at members/{id}.
      //    Password is the member's DOB, format YYYY-MM-DD.
      const snap = await get(ref(db, 'members/' + id));
      if (snap.exists()) {
        const member = snap.val();
        if (member.dob === pass) {
          sessionStorage.setItem('ft_role', 'member');
          sessionStorage.setItem('ft_id', id);
          sessionStorage.setItem('ft_name', [member.firstName, member.lastName].filter(Boolean).join(' '));
          setTimeout(() => { window.location.href = 'member.html'; }, 350);
          return;
        }
      }
      setLoading(false);
      showError('Invalid ID or password.');
    } catch (err) {
      setLoading(false);
      showError('Could not reach database. Check connection.');
      console.error(err);
    }
  });
</script>
